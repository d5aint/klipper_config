##########################################################
## Bounded chamber wait
## TEMPERATURE_WAIT has no timeout, and a delayed_gcode watchdog cannot
## interrupt it because the gcode mutex is held for the whole print start.
## So the wait is built from short polling steps instead: WAIT_CHAMBER
## expands into one _CHAMBER_POLL call per POLL seconds of the timeout.
## Every poll is rendered when it runs, so it reads the live temperature,
## and once the target is reached the remaining polls are instant no-ops.
##########################################################

[gcode_macro WAIT_CHAMBER]
description: Wait for chamber >= TARGET (C), give up after TIMEOUT min. Usage: WAIT_CHAMBER TARGET=34 [TIMEOUT=30] [ACTION=abort|continue]
gcode:
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set TARGET = params.TARGET|default(0)|float %}
    {% set TIMEOUT = params.TIMEOUT|default(vars.chamber_wait_timeout)|float %}
    {% set ACTION = params.ACTION|default(vars.chamber_wait_action)|string|lower %}
    {% set POLL = vars.chamber_wait_poll %}
    {% set STEPS = (TIMEOUT * 60 / POLL)|round(0, 'ceil')|int %}

    {% for i in range(STEPS) %}
        _CHAMBER_POLL TARGET={TARGET} POLL={POLL} STEP={i}
    {% endfor %}
    _CHAMBER_WAIT_RESULT TARGET={TARGET} TIMEOUT={TIMEOUT} ACTION={ACTION}

[gcode_macro _CHAMBER_POLL]
description: One step of WAIT_CHAMBER, sleeps POLL seconds only while the chamber is below TARGET
gcode:
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set current = printer["temperature_sensor " ~ vars.chamber_sensor_name].temperature|float %}
    {% set TARGET = params.TARGET|float %}
    {% if current < TARGET %}
        {% set POLL = params.POLL|default(vars.chamber_wait_poll)|int %}
        {% if vars.verbose and (params.STEP|default(0)|int) % vars.chamber_wait_report_every == 0 %}
            RESPOND MSG="Chamber: {'%.1f' % current}C / {TARGET|int}C"
        {% endif %}
        G4 P{POLL * 1000}
    {% endif %}

[gcode_macro _CHAMBER_WAIT_RESULT]
description: Final check of WAIT_CHAMBER, aborts the print or continues if the chamber never got there
gcode:
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set current = printer["temperature_sensor " ~ vars.chamber_sensor_name].temperature|float %}
    {% set TARGET = params.TARGET|float %}
    {% if current >= TARGET %}
        {% if vars.verbose %}RESPOND MSG="Chamber at {'%.1f' % current}C, continuing"{% endif %}
    {% else %}
        {% set msg = "Chamber timeout: %.1fC after %d min, needed %dC" % (current, params.TIMEOUT|float, TARGET) %}
        {% if params.ACTION|default('abort')|lower == 'continue' %}
            RESPOND TYPE=error MSG="{msg}. Continuing anyway."
        {% else %}
            { action_raise_error(msg ~ ". Aborting print.") }
        {% endif %}
    {% endif %}
