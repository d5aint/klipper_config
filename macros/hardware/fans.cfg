[gcode_macro START_FILTER]
description: Run a filter fan (default: exhaust). Usage: START_FILTER [FILTER_NAME=chamber_filter] [SPEED=0-1]
gcode:
	{% set vars = printer["gcode_macro _USER_VARIABLES"] %}
	{% set SPEED = params.SPEED|default(vars.filter_default_speed)|float %}
	{% set FILTER_NAME = params.FILTER_NAME|default(vars.filter_exhaust_name) %}

	SET_FAN_SPEED FAN={FILTER_NAME} SPEED={SPEED}

[gcode_macro STOP_FILTER]
description: Stop a filter fan (default: exhaust). Usage: STOP_FILTER [FILTER_NAME=chamber_filter]
gcode:
	{% set vars = printer["gcode_macro _USER_VARIABLES"] %}
	{% set FILTER_NAME = params.FILTER_NAME|default(vars.filter_exhaust_name) %}

	SET_FAN_SPEED FAN={FILTER_NAME} SPEED=0

[delayed_gcode _STOP_FILTER_DELAYED_CHAMBER]
gcode:
	{% set vars = printer["gcode_macro _USER_VARIABLES"] %}
	STOP_FILTER FILTER_NAME="{vars.filter_chamber_name}"

[delayed_gcode _STOP_FILTER_DELAYED_EXHAUST]
gcode:
	{% set vars = printer["gcode_macro _USER_VARIABLES"] %}
	STOP_FILTER FILTER_NAME="{vars.filter_exhaust_name}"

[gcode_macro BEDFANS_SLOW]
description: Run the bed fans at the slow speed
gcode:
	{% set vars = printer["gcode_macro _USER_VARIABLES"] %}
	SET_FAN_SPEED FAN={vars.bedfan_name} SPEED={vars.bedfan_slow|float}

[gcode_macro BEDFANS_FAST]
description: Run the bed fans at the fast speed
gcode:
	{% set vars = printer["gcode_macro _USER_VARIABLES"] %}
	SET_FAN_SPEED FAN={vars.bedfan_name} SPEED={vars.bedfan_fast|float}

[gcode_macro BEDFANS_OFF]
description: Turn the bed fans off
gcode:
	{% set vars = printer["gcode_macro _USER_VARIABLES"] %}
	SET_FAN_SPEED FAN={vars.bedfan_name} SPEED=0

[delayed_gcode BEDFAN_LOOP]
gcode:
	{% set vars = printer["gcode_macro _USER_VARIABLES"] %}
	{% set THRESHOLD = vars.bedfan_threshold|int %}
	{% set TOLERANCE = vars.bedfan_temp_tolerance|int %}

	{% if printer.heater_bed.target >= THRESHOLD %}
		{% if printer.heater_bed.temperature|int >= (printer.heater_bed.target|int - TOLERANCE) %}
			BEDFANS_SLOW
		{% else %}
			UPDATE_DELAYED_GCODE ID=BEDFAN_LOOP DURATION={vars.bedfan_loop_interval}
		{% endif %}
	{% endif %}
