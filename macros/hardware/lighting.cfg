[gcode_macro STATUS_LEDS]
description: Set the logo, nozzle and case LEDs to a named state. Usage: STATUS_LEDS COLOR=ready|busy|heating|homing|...
gcode:
    {% set vars = printer["gcode_macro _USER_VARIABLES"] %}
    {% set color = params.COLOR|default('off')|lower %}
    {% set logo_leds_name = printer["gcode_macro _USER_VARIABLES"]["status_leds_logo_led_name"] %}
    {% set nozzle_leds_name = printer["gcode_macro _USER_VARIABLES"]["status_leds_nozzle_led_name"] %}
    {% set logo_transmit = 0 if (logo_leds_name == nozzle_leds_name) else 1 %}

    {% set status_color = vars.status_leds_states %}

    {% if not (color in status_color) %}
        { action_raise_error("COLOR is not valid!") }
    {% endif %}

    SET_LED_EFFECT EFFECT={vars.status_leds_logo_effect_prefix + status_color[color].logo} REPLACE=1 FADETIME={vars.status_leds_fadetime}
    SET_LED_EFFECT EFFECT={vars.status_leds_nozzle_effect_prefix + status_color[color].nozzle} REPLACE=1 FADETIME={vars.status_leds_fadetime}
    SET_LED_EFFECT EFFECT={vars.status_leds_caselight_effect_prefix + status_color[color].caselight} REPLACE=1 FADETIME={vars.status_leds_fadetime}
