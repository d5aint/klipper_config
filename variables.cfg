[gcode_macro _USER_VARIABLES]
variable_verbose: True

##########################################################
## Feedrate and accels setpoints for all the macros
##########################################################

## SPEEDS
variable_zhop_speed: 15
variable_homing_travel_speed: 350
variable_travel_speed: 350
variable_brush_clean_speed: 200

## ACCELS
variable_homing_travel_accel: 2000
variable_tilting_travel_accel: 3000
variable_brush_clean_accel: 2000

##########################################################
## Homing, start_print and end_print variables
##########################################################

variable_zhop: 20
variable_homing_backoff_distance_xy: -20, -20
variable_sensorless_current_factor: 72
variable_safe_extruder_temp: 150

variable_turn_off_heaters_in_end_print: True

variable_filament_sensor_enabled: True

## Chamber wait in START_PRINT (see WAIT_CHAMBER): give up after this many minutes
variable_chamber_wait_timeout: 30
## On timeout: 'abort' cancels the print, 'continue' warns and prints anyway
variable_chamber_wait_action: 'abort'

## HEATSOAK_BED defaults (each can be overridden per call: TEMP= SOAKTIME= MOVE= SKIP_TEMP=)
## Bed target (C) when TEMP= is not given
variable_heatsoak_default_temp: 0
## Soak duration in minutes when SOAKTIME= is not given
variable_heatsoak_default_time: 2
## 1 = home + park the toolhead before soaking, 0 = stay where it is
variable_heatsoak_default_move: 1
## Z height (mm) the toolhead parks at while soaking
variable_heatsoak_park_z: 30
## Skip the soak wait if the chamber is already at/above this temp (C) when called
## (bed was already soaked, e.g. from a previous print). 0 disables.
variable_heatsoak_skip_chamber_temp: 40

## Prime nozzle
variable_prime_line_xy: 5, 10
variable_prime_line_direction: "X"
variable_prime_line_length: 100
variable_prime_line_height: 0.6
variable_prime_line_purge_distance: 30
variable_prime_line_flowrate: 20

##########################################################
## Filter specific variables
##########################################################

variable_filter_exhaust_name: "exhaust_filter"
variable_filter_chamber_name: "chamber_filter"
variable_filter_hepa_life: 4320
variable_filter_media_life: 80
variable_filter_default_time: 600
## Fan speed (0-1) START_FILTER uses when SPEED= is not given
variable_filter_default_speed: 1

##########################################################
## Bed fans (macros/hardware/fans.cfg)
##########################################################

## Name of the bed [fan_generic ...] in machine.cfg
variable_bedfan_name: "bed_fans"
## If the bed target is at/above this temp (C) the fans are enabled; below it they are disabled
variable_bedfan_threshold: 95
## Fan speed (0-1) while bed is heating
variable_bedfan_fast: 0.7
## Fan speed (0-1) once bed temp is reached
variable_bedfan_slow: 0.2
## BEDFAN_LOOP: seconds between checks while waiting for the bed to reach its target
variable_bedfan_loop_interval: 5
## BEDFAN_LOOP: the bed counts as at temperature when within this many degrees (C) of its target
variable_bedfan_temp_tolerance: 1

##########################################################
## Other hardware options used in the macros
##########################################################

## Name of the chamber [temperature_sensor ...] in machine.cfg
variable_chamber_sensor_name: "chamber"

## Brush and purge bucket
variable_extruder_cleaning_temp: 150
variable_brush_over_y_axis: False
variable_brush_xyz: 224, 306, 2.5
variable_purge_bucket_xyz: 268, 308, 12
variable_purge_distance: 20
variable_purge_ooze_time: 8000

## Resonnance testing position
variable_resonnance_test_point_xy: 150, 150
variable_resonnance_test_z_clearance: 50

##########################################################
## Macro tunables (formerly hard-coded inside the macros)
##########################################################

## Material used by CLEAN_NOZZLE, LOAD/UNLOAD/PURGE_FILAMENT and CHANGE_FILAMENT when MATERIAL= is not given,
## and by those macros plus END_PRINT as the fallback when the material is not in material_parameters
variable_macro_default_material: 'PLA'
## Name of the [filament_switch_sensor ...] in machine.cfg
variable_filament_sensor_name: "filament_sensor"
## Nozzle size (mm) SET_NOZZLE / CHECK_NOZZLE assume when none is given or saved
variable_default_nozzle_size: 0.4
## Seconds a print-time message (M117) stays on the display
variable_display_clear_delay: 10
## ADAPTIVE_BED_MESH: margin (mm) added around the first layer
variable_adaptive_mesh_margin: 5
## USB name fragment RESTART_CAMERA looks for in lsusb when CAMERA= is not given
variable_camera_usb_match: "C920"
## Milliseconds MCU_TIMING_INSTALL / _REMOVE wait for the shell command before restarting Klipper
variable_mcu_timing_restart_delay: 1000

## ---- START_PRINT / END_PRINT
## START_PRINT: after meshing the toolhead waits this many mm before the prime line start (X) ...
variable_start_print_approach_offset_x: 5
## ... at this height (Z, mm)
variable_start_print_approach_z: 10
## START_PRINT: materials that wait for the chamber to warm up (see WAIT_CHAMBER)
variable_chamber_wait_materials: ["ABS", "ASA"]
## END_PRINT: relative retraction moves, applied in order. Each entry is [extruder mm, Z lift mm (0 = none), speed mm/min]
variable_end_print_retract_steps: [[-2.0, 0, 3000], [-2.0, 0.2, 2400], [-18, 0, 800]]
## END_PRINT: motors released when the print ends (Z stays energised so the gantry does not drop)
variable_end_print_motors_off: "X Y E"

## ---- PARK
## Position used when PARK is called without MODE=  (FRONT, REAR or CENTER)
variable_park_default_mode: "REAR"
## PARK first raises Z to (max Z / 2) minus this many mm if it is lower than that ...
variable_park_z_margin: 60
## ... at this speed (mm/min)
variable_park_z_speed: 600
## If the toolhead is already above that height it is only lifted by this many mm
variable_park_tall_lift: 5
## FRONT: distance (mm) from the front edge
variable_park_front_y_offset: 10
## REAR: distance (mm) from the rear right corner, X then Y
variable_park_rear_offset_xy: 30, 30

## ---- PAUSE / RESUME
## PAUSE: retract this much (mm) at this speed (mm/min) before parking, to stop the nozzle oozing
variable_pause_retract_length: 2.0
variable_pause_retract_speed: 3600
## PAUSE: idle timeout (seconds) while paused. 43200 = 12 h, for overnight pauses
variable_pause_idle_timeout: 43200
## RESUME: prime this much (mm) at this speed (mm/min) before returning to the print
variable_resume_prime_length: 2.0
variable_resume_prime_speed: 1500

## ---- Nozzle cleaning (CLEAN_NOZZLE), see also the brush variables above
## Length (mm) of one X scrub stroke, and how many back-and-forth passes (done twice, the second time raised)
variable_brush_wipe_x: 46
variable_brush_wipe_passes_x: 6
## Y scrub stroke (mm) and passes, only used when brush_over_y_axis is True
variable_brush_wipe_y: 6
variable_brush_wipe_passes_y: 6
## Z raise (mm) between the two X scrubs
variable_brush_raise_z: 0.5
## Z (mm) to lift to after scrubbing
variable_brush_exit_z: 10

## ---- Homing
## Seconds to settle at the safe spot before homing Y
variable_homing_settle_time: 1
## accel_to_decel is set to homing_travel_accel times this while homing (also the fallback when the printer config has none)
variable_homing_accel_to_decel_ratio: 0.5

## ---- Prime line (see prime_line_* above)
## If the toolhead is lower than this (mm) it is lifted to it before travelling to the prime line
variable_prime_line_min_z: 5
## Extrude this much (mm) at this speed (mm/min) at the start position before drawing the line
variable_prime_line_start_extrude: 10
variable_prime_line_start_speed: 300
## Retract this much (mm) at this speed (mm/min) after the line
variable_prime_line_retract: 0.8
variable_prime_line_retract_speed: 2500
## Z (mm) to lift to once the line is done
variable_prime_line_end_z: 3

## ---- Filament load / unload / purge
## Small retraction after loading or purging so the nozzle does not drool
variable_filament_ooze_retract: 2.0
variable_filament_ooze_speed: 1800
## LOAD_FILAMENT: total distance (mm); the first load_fast_length is pushed fast (gears to hotend), the rest slow
variable_load_default_distance: 120
variable_load_fast_length: 50
variable_load_fast_speed: 1800
variable_load_slow_speed: 300
## UNLOAD_FILAMENT: total distance (mm) and the pull speed for everything after the tip shaping
variable_unload_default_distance: 80
variable_unload_pull_speed: 3000
## Subtracted from the distance to get the final fast pull
variable_unload_distance_offset: 20
## Tip shaping, lengths in mm and speeds in mm/min. RAM: push forward to melt the tip (raise the length if you get hairs)
variable_unload_ram_length: 5
variable_unload_ram_speed: 300
## JERK: rapid retraction to break the melt strand
variable_unload_jerk_length: 10
variable_unload_jerk_speed: 3000
## COOL: wait (ms) for the tip to skin over (raise if you get hairs)
variable_unload_cool_time: 3000
## PUSH then RETRACT: second shaping pass
variable_unload_push_length: 10
variable_unload_push_speed: 1800
variable_unload_retract_length: 10
variable_unload_retract_speed: 2600
## CLEAR: slow initial pull to clear the break zone
variable_unload_clear_length: 28
variable_unload_clear_speed: 1800
## PURGE_FILAMENT: default distance (mm) and flow speed (mm/min). Note purge_distance / purge_ooze_time above are not used by it
variable_purge_default_distance: 40
variable_purge_speed: 300
## When moving to the purge bucket: lift this many mm above the bucket Z first, and wait this many ms once there
variable_purge_bucket_lift: 10
variable_purge_bucket_settle: 2000

## ---- Probing and temperature waits
## ACTIVATE_PROBE: part-cooling fan speed (0-255) while the nozzle cools down for TAP
variable_probe_cooldown_fan: 255
## M109 waits until the nozzle is within this many degrees (C) of the target
variable_extruder_wait_tolerance: 1
## M190 waits until the bed is between the target and the target plus this many degrees (C)
variable_bed_wait_max_over: 5
## Seconds before BEDFAN_LOOP first runs after a high bed target is set
variable_bedfan_loop_start_delay: 1

## ---- Chamber wait (WAIT_CHAMBER)
## Seconds between chamber temperature checks, and a progress message every N checks
variable_chamber_wait_poll: 10
variable_chamber_wait_report_every: 6

## ---- Status LEDs (STATUS_LEDS COLOR=<state>)
## led_effect names are prefix + the value from status_leds_states
variable_status_leds_logo_effect_prefix: "sb_logo_"
variable_status_leds_nozzle_effect_prefix: "sb_nozzle_"
variable_status_leds_caselight_effect_prefix: "cl_"
## Fade time (seconds) when switching effects
variable_status_leds_fadetime: 0.5
## State -> which effect each LED group plays
variable_status_leds_states: {
        'ready': {'logo': 'standby', 'nozzle': 'standby', 'caselight': 'standby', 'minidisplay': 'on'},
        'busy': {'logo': 'busy', 'nozzle': 'on', 'caselight': 'busy', 'minidisplay': 'on'},
        'heating': {'logo': 'heating', 'nozzle': 'heating', 'caselight': 'heating', 'minidisplay': 'on'},
        'leveling': {'logo': 'leveling', 'nozzle': 'on', 'caselight': 'leveling', 'minidisplay': 'on'},
        'homing': {'logo': 'homing', 'nozzle': 'on', 'caselight': 'homing', 'minidisplay': 'on'},
        'cleaning': {'logo': 'cleaning', 'nozzle': 'on', 'caselight': 'cleaning', 'minidisplay': 'on'},
        'meshing': {'logo': 'meshing', 'nozzle': 'on', 'caselight': 'meshing', 'minidisplay': 'on'},
        'calibrating_z': {'logo': 'calibrating_z', 'nozzle': 'on', 'caselight': 'calibrating_z', 'minidisplay': 'on'},
        'printing': {'logo': 'printing', 'nozzle': 'on', 'caselight': 'printing', 'minidisplay': 'on'},
        'done_printing': {'logo': 'done_printing', 'nozzle': 'done_printing', 'caselight': 'done_printing', 'minidisplay': 'off'},
        'on': {'logo': 'on', 'nozzle': 'on', 'caselight': 'on', 'minidisplay': 'on'},
        'standby': {'logo': 'standby', 'nozzle': 'standby', 'caselight': 'standby', 'minidisplay': 'off'},
        'off': {'logo': 'off', 'nozzle': 'off', 'caselight': 'off', 'minidisplay': 'off'},
        'error': {'logo': 'error', 'nozzle': 'error', 'caselight': 'error', 'minidisplay': 'error'},
        'shutdown': {'logo': 'off', 'nozzle': 'off', 'caselight': 'off', 'minidisplay': 'shutdown'},
    }

##########################################################
## MMU/ERCF specific variables
##########################################################
variable_mmu_enabled: False

##########################################################
## Default material and specific print parameters
##########################################################

variable_print_default_bed_temp: 80
variable_print_default_extruder_temp: 230
variable_print_default_chamber_temp: 36
